[package]
name = "pendant"
version = "0.1.0"
description = "Fanuc G-code generator for common milling and drilling operations"
authors = ["Lee Holmes"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
